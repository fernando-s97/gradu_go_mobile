name: gradu_go
description: "A hub for graduates benefits"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  url_launcher: ^6.3.0
  transparent_image: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  intl: ^0.19.0
  card_swiper: ^3.0.1
  collection: ^1.19.0
  json_annotation: ^4.9.0
  injectable: ^2.4.4
  get_it: ^7.7.0
  freezed_annotation: ^2.4.4
  flutter_bloc: any
dependency_overrides:
  collection: ^1.19.0

dev_dependencies:
  build_runner: ^2.4.12
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  lint: ^2.3.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
